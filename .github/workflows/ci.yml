name: Validate sandbox publisher

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    name: Debian Trixie ARM64 integration
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out publisher repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test signed archive lifecycle
        run: |
          docker run --rm --platform linux/arm64 \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            debian@sha256:34cd9e9fd437c0a095ec39cb2e73422c9f30821b0d0848ed74fd0d43bae4d958 \
            ./tests/run-in-container.sh
